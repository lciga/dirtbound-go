<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8590c"><title>Вход · DirtBound</title><link rel="icon" href="favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:linear-gradient(125deg,rgba(22,38,24,.75),rgba(22,25,32,.55)),url('images/themes/summer.webp') center/cover;font:700 16px system-ui,sans-serif;color:#1f2430}.card{width:min(440px,100%);padding:36px;background:#fff;border-radius:24px;box-shadow:0 24px 80px #0005}a{color:inherit}h1{font-size:40px;letter-spacing:-2px;font-style:italic;margin:20px 0 6px}.intro{color:#6b7185;font-size:14px;line-height:1.5;margin:0 0 24px}.tabs{display:flex;background:#eef0f5;border-radius:12px;padding:4px;gap:4px}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:12px}.tabs button{flex:1;background:none}.tabs [aria-selected=true]{background:#1f2430;color:white}label{display:block;font-size:13px;margin:20px 0 8px}input{width:100%;padding:14px;background:#eef0f5;border:2px solid transparent;border-radius:12px;color:#1f2430}input:focus{outline:0;border-color:#e8590c}.go{margin-top:24px;width:100%;background:#e8590c;color:white;font-size:18px;font-style:italic;text-transform:uppercase;padding:16px}.go:disabled{opacity:.6;cursor:wait}.error{color:#b52a20;font-size:14px;line-height:1.5;margin-bottom:0}.help{font-size:12px;color:#6b7185;margin:8px 0 0}.back{font-size:13px;text-decoration:none}.foot{font-size:12px;color:#6b7185;margin-top:22px} :focus-visible{outline:3px solid #e8590c;outline-offset:2px}
</style></head><body><main class="card"><a class="back" href="index.html">← В игру</a><h1>DIRTBOUND</h1><p class="intro">Твои рекорды, трассы и заезды с друзьями.</p><div class="tabs" role="tablist" aria-label="Способ входа"><button type="button" id="login-tab" role="tab" aria-selected="true">Вход</button><button type="button" id="register-tab" role="tab" aria-selected="false">Регистрация</button></div><form id="auth"><label for="username">Логин</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="20" autocapitalize="none" spellcheck="false"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"><div id="repeat-field" hidden><label for="repeat">Повтори пароль</label><input id="repeat" type="password" autocomplete="new-password" minlength="8" maxlength="128"></div><p class="help" id="help">Логин без пробелов. Пароль от 8 символов.</p><p id="error" class="error" role="alert" hidden></p><button class="go" id="submit" type="submit">Войти</button></form><p class="foot">Профиль этой версии игры. <a href="confidentialite.html">Хранение данных</a></p></main><script type="module">
const form=document.querySelector('#auth'),password=document.querySelector('#password'),repeat=document.querySelector('#repeat'),error=document.querySelector('#error'),submit=document.querySelector('#submit');let mode='login';
function select(next){mode=next;document.querySelector('#login-tab').setAttribute('aria-selected',mode==='login');document.querySelector('#register-tab').setAttribute('aria-selected',mode==='register');document.querySelector('#repeat-field').hidden=mode!=='register';repeat.required=mode==='register';password.autocomplete=mode==='register'?'new-password':'current-password';submit.textContent=mode==='register'?'Создать профиль':'Войти';error.hidden=true}
document.querySelector('#login-tab').addEventListener('click',()=>select('login'));document.querySelector('#register-tab').addEventListener('click',()=>select('register'));
form.addEventListener('submit',async event=>{event.preventDefault();error.hidden=true;if(mode==='register'&&password.value!==repeat.value){error.textContent='Пароли не совпадают.';error.hidden=false;return}submit.disabled=true;try{const response=await fetch('api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value,password:password.value,next:(new URLSearchParams(location.search).get('next')||'/index.html')+location.hash})});const body=await response.json();if(!response.ok||!body.success)throw new Error(body.error||'Не удалось войти.');location.href=body.data.url}catch(e){error.textContent=e.message;error.hidden=false}finally{submit.disabled=false}});
</script></body></html>
