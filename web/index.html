<!DOCTYPE html>
<html lang="fr" data-ui="wait">
<head>
	<meta charset="utf-8">
	<script>
		// One address for the site: www and the old domain go to dirtbound.fr (the Google
		// sign-in only trusts it, and the session cookie is its own)
		if ( /^(www\.dirtbound\.fr|dirtbound\.victorboutros\.fr)$/.test( location.hostname ) ) location.replace( 'https://dirtbound.fr' + location.pathname + location.search + location.hash );
	</script>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>DirtBound</title>
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="icon" href="favicon.ico" sizes="48x48">
	<!-- Share preview (images/og.jpg: made with the photo lab, now lab/studio.html, format Partage 1200 × 630) -->

	<meta name="twitter:title" content="DirtBound">
	<meta name="twitter:description" content="Jeu de course et de rallye gratuit dans le navigateur : spéciales générées à l'infini, éditeur de circuits, classements et multijoueur.">
	<meta name="twitter:image" content="https://dirtbound.fr/images/og.jpg">
	<script>
		// Old shared links (index.html?rally=..., ?track=..., #track=..., ?map=...) now live in play.html
		if ( /[?&#](rally|track|map|car|circuit)=/.test( location.search + location.hash ) ) location.replace( 'play.html' + location.search + location.hash );
	</script>
	<style>
		/* Fonts: 'brand' (the titles: Walls.js, the garage's car names) and 'text' (all the rest, variable weight / slant),
		   no @font-face: js/menu/Fonts.js adds them decrypted from fonts/packed/ (tools/pack_fonts.mjs) */
		:root {
			--track: -0.04em; /* letter-spacing of the 'text' font */
			--ink: #1f2430;
			--muted: #6b7185;
			--card: rgba(255, 255, 255, 0.95);
			--soft: #eef0f5;
			--soft-hover: #e2e6ef;
			--accent: #e8590c;
			--accent-hover: #d14c05;
			--grass: #cfe8d6;
			--radius: 20px;
			--shadow: 0 18px 50px rgba(20, 24, 36, 0.22);
		}
		:root:lang(ja), :root:lang(zh), :root:lang(ko) { --track: 0; } /* their characters touch when pulled together (Walls.js TRACK too) */
		* { box-sizing: border-box; }
		body { margin: 0; overflow: hidden; background: #adb2ba; color: var(--ink); font: 700 15px 'text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; letter-spacing: var(--track); }
		button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }
		button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
		#showroom { position: fixed; inset: 0; }
		#showroom canvas { display: block; }
		#showroom canvas.titles { position: absolute; inset: 0; pointer-events: none; }
		#showroom .titles-scrim { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; background: linear-gradient(90deg, rgba(12, 16, 24, 0.62) 0%, rgba(12, 16, 24, 0.28) 22%, rgba(12, 16, 24, 0) 36%, rgba(12, 16, 24, 0) 64%, rgba(12, 16, 24, 0.28) 78%, rgba(12, 16, 24, 0.62) 100%); }
		#showroom .titles-scrim.on { opacity: 1; }

		/* ─── Top bar ─── */
		#topbar { position: fixed; top: 24px; left: 32px; right: 32px; display: flex; align-items: center; gap: 18px; z-index: 5; pointer-events: none; }
		#topbar > * { pointer-events: auto; }
		#crumbs { display: flex; border-radius: 999px; background: var(--card); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15); font-size: 20px; font-weight: 900; font-style: italic; }
		#crumbs:empty { display: none; }
		#online { display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: var(--card); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15); font-size: 13px; font-weight: 900; }
		#online[hidden] { display: none; }
		#circuit-search { display: flex; }
		#circuit-search[hidden] { display: none; }
		#circuit-search input { width: 220px; padding: 9px 16px; border-radius: 999px; background: var(--card); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15); font-size: 14px; font-weight: 800; }
		#online .dot { width: 8px; height: 8px; border-radius: 50%; background: #2f9e44; box-shadow: 0 0 0 0 rgba(47, 158, 68, 0.6); animation: online-pulse 2s infinite; }
		@keyframes online-pulse { 0% { box-shadow: 0 0 0 0 rgba(47, 158, 68, 0.5); } 70% { box-shadow: 0 0 0 6px rgba(47, 158, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(47, 158, 68, 0); } }
		.crumb { display: flex; align-items: center; gap: 10px; padding: 5px 18px 5px 5px; border-radius: inherit; font: inherit; color: inherit; }
		.crumb .back { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--soft); font-size: 18px; font-style: normal; transition: background 0.12s; }
		.crumb:hover .back { background: var(--soft-hover); }
		#profile { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border-radius: 999px; background: var(--card); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.16); font-size: 14px; font-weight: 900; text-align: left; }
		#profile:hover { background: #fff; }
		#profile .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 900; }
		#profile small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
		#pseudo-pop { position: fixed; top: 80px; right: 32px; width: 300px; padding: 16px; border-radius: 16px; background: #fff; box-shadow: var(--shadow); z-index: 6; }
		#pseudo-pop[hidden] { display: none; }
		#pseudo-pop label { font-size: 12px; font-weight: 900; letter-spacing: var(--track); text-transform: uppercase; color: var(--muted); }
		#pseudo-pop .row { display: flex; gap: 8px; margin-top: 8px; }

		/* ─── Shared controls ─── */
		input { font: inherit; font-weight: 800; min-width: 0; flex: 1; padding: 10px 14px; border-radius: 12px; border: 0; background: var(--soft); color: var(--ink); }
		.field { display: block; font-size: 12px; font-weight: 900; letter-spacing: var(--track); text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
		.field:first-child { margin-top: 0; }
		.seg { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--soft); }
		.seg button { flex: 1; padding: 9px 6px; border-radius: 9px; font-weight: 800; font-size: 14px; }
		.seg button:hover { background: var(--soft-hover); }
		.seg button.on { background: var(--ink); color: #fff; }
		.note { margin: 10px 2px 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
		.note.error { color: #c0392b; font-weight: 800; }
		.chip { padding: 8px 14px; border-radius: 999px; background: var(--soft); font-weight: 900; font-size: 13px; }
		.chip:hover { background: var(--soft-hover); }
		.chip.on { background: var(--ink); color: #fff; }
		.chip.star.on { background: #ffd35c; color: #6b4a00; }
		.go { flex: 1; padding: 15px 18px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 18px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: var(--track); }
		.go:hover { background: var(--accent-hover); }
		.secondary { padding: 15px 16px; border-radius: 14px; background: var(--soft); font-weight: 900; }
		.secondary:hover { background: var(--soft-hover); }
		.panel { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

		/* ─── Mode cards (home, solo) ─── */
		.modes { position: fixed; left: 32px; right: 32px; bottom: 32px; display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
		.mode { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; width: 250px; height: 170px; padding: 18px 20px; border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); text-align: left; overflow: hidden; transition: transform 0.15s, box-shadow 0.15s; }
		.mode:not(:disabled):hover { box-shadow: 0 24px 60px rgba(20, 24, 36, 0.3); }
		.mode b { font-size: 28px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: var(--track); line-height: 1.05; }
		.mode > span:not(.icon):not(.art) { color: var(--muted); font-size: 13.5px; line-height: 1.35; }
		.mode .icon { position: absolute; top: 18px; left: 20px; width: 34px; height: 34px; }
		.mode .icon svg, .mini .icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
		.mode.primary { width: 320px; height: 210px; background: var(--accent); color: #fff; }
		.mode.primary > span:not(.icon) { color: rgba(255, 255, 255, 0.85); }
		.mode.primary b { font-size: 40px; }
		.mode.primary .icon { width: 44px; height: 44px; }
		.mode.soon { cursor: default; background: rgba(255, 255, 255, 0.72); color: #545b6e; }
		.mode.soon em { position: absolute; top: 20px; right: 18px; font-style: normal; font-size: 11px; font-weight: 900; letter-spacing: var(--track); text-transform: uppercase; background: var(--ink); color: #fff; padding: 3px 8px; border-radius: 999px; }
		.mode.big { width: 360px; height: 300px; }
		.mode .art { position: absolute; inset: 12px 12px 110px; border-radius: 14px; background: var(--grass); display: grid; place-items: center; }
		.mode .art .thumb { width: 100%; height: 100%; }
		.minor { display: flex; flex-direction: column; gap: 10px; }
		.mini { display: flex; align-items: center; gap: 12px; width: 250px; padding: 14px 16px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); text-align: left; transition: transform 0.15s; }
		.mini .icon { width: 30px; height: 30px; flex: none; color: var(--accent); }
		.mini b { display: block; font-size: 17px; font-weight: 900; }
		.mini small { display: block; color: var(--muted); font-size: 12.5px; }

		/* ─── Browser + detail (circuits, rally) ─── */
		.split { position: fixed; top: 96px; left: 32px; right: 32px; bottom: 32px; display: flex; justify-content: space-between; gap: 16px; pointer-events: none; }
		.split > * { pointer-events: auto; }
		.browser, .settings { width: 560px; padding: 18px; display: flex; flex-direction: column; min-height: 0; align-self: flex-start; max-height: 100%; }
		.settings { width: 420px; align-self: flex-start; }
		.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--soft); flex: none; }
		.tabs button { flex: 1; padding: 10px; border-radius: 11px; font-weight: 900; }
		.tabs button:hover { background: var(--soft-hover); }
		.tabs button.on { background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
		.hint { margin: 10px 4px 0; font-size: 12.5px; color: var(--muted); }
		.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; overflow-y: auto; padding: 2px; min-height: 0; }
		.card { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 16px; background: var(--soft); text-align: left; transition: background 0.12s; }
		/* Multiplayer lobby */
		.lobby-main { overflow-y: auto; gap: 6px; }
		.lobby-browser { flex: 1; max-width: 1060px; padding: 18px; display: flex; flex-direction: column; min-height: 0; align-self: flex-start; max-height: 100%; }
		.lobby-browser button:disabled { opacity: 0.45; cursor: not-allowed; }
		.lobby-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
		.lobby-head h3 { margin: 0; }
		.lobby-head .note { margin-top: 4px; max-width: 560px; }
		.lobby-head .chip { flex: none; }
		.lobby-tools { display: flex; gap: 8px; align-items: flex-start; flex: none; }
		.lobby-join { flex: none; width: 270px; }
		.lobby-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; overflow-y: auto; padding: 2px; min-height: 0; }
		.lobby-card.new { background: #fff; }
		.lobby-count { display: grid; place-items: center; align-content: center; aspect-ratio: 16 / 10; border-radius: 11px; background: var(--ink); color: rgba(255, 255, 255, 0.7); font-weight: 900; font-size: 14px; }
		.lobby-count b { color: #fff; font-size: 38px; line-height: 1; font-weight: 900; }
		.card-text .lobby-status { font-weight: 900; }
		.card-text .lobby-status.open { color: #2f9e44; }
		.lobby-empty { grid-column: 2 / -1; align-self: center; margin: 0 8px; }
		.lobby-create { margin-top: 14px; max-width: 440px; }
		.lobby-create h3 { margin: 0 0 4px; }
		.lobby-create input { width: 100%; box-sizing: border-box; }
		.lobby-main h4 { margin: 12px 0 4px; }
		.lobby-main button:disabled, [data-screen="multi"] button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
		.lobby-code { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--soft, #eef0f5); }
		.lobby-code small { display: block; font-size: 11px; font-weight: 900; letter-spacing: var(--track); text-transform: uppercase; opacity: 0.7; }
		.lobby-code b { flex: 1; font-size: 34px; font-weight: 900; letter-spacing: var(--track); font-variant-numeric: tabular-nums; }
		.lobby-players { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
		.lobby-players li { display: grid; grid-template-columns: auto auto 1fr auto auto; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.55); }
		.lobby-players li.me { outline: 2px solid var(--accent, #e8590c); }
		.lobby-players small { opacity: 0.7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.lobby-players .crown { width: 16px; height: 16px; fill: #f2b01e; }
		.lobby-players .off { font-size: 12px; opacity: 0.7; }
		.lobby-players .ready { font-size: 12px; font-weight: 900; opacity: 0.6; }
		.lobby-players .ready.on { color: #2f9e44; opacity: 1; }
		.mini-btn { padding: 2px 8px; border-radius: 8px; }
		.stepper { display: flex; align-items: center; gap: 10px; }
		.stepper b { min-width: 72px; text-align: center; }
		.card.vote.on { outline: 3px solid var(--accent, #e8590c); }
		.card.vote:disabled { opacity: 0.45; cursor: not-allowed; }
		.results { list-style: none; margin: 8px 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
		.results li { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: var(--soft); }
		.results em { font-style: normal; font-weight: 900; font-variant-numeric: tabular-nums; }
		.card.vote .voters { color: var(--accent, #e8590c); font-weight: 900; }
		.note.warn { color: #c92a2a; font-weight: 900; }
		.countdown b { font-variant-numeric: tabular-nums; }
		#lobby-code { text-transform: uppercase; letter-spacing: var(--track); font-weight: 900; }
		.card:hover { background: var(--soft-hover); }
		.card.on { background: #fff; box-shadow: 0 0 0 3px var(--accent); }
		.card-thumb { display: grid; place-items: center; aspect-ratio: 16 / 10; border-radius: 11px; background: var(--grass); overflow: hidden; }
		.card-thumb .thumb { width: 100%; height: 100%; }
		.card-thumb.plus { font-size: 44px; font-weight: 300; color: var(--muted); background: #fff; border: 2px dashed #cdd2dd; }
		.card-text b { display: block; font-weight: 900; overflow-wrap: anywhere; }
		.card-text small { display: block; color: var(--muted); font-size: 12.5px; }
		.badge { position: absolute; top: 16px; right: 16px; padding: 3px 9px; border-radius: 999px; background: rgba(255, 255, 255, 0.92); font-size: 12px; font-weight: 900; font-variant-numeric: tabular-nums; }
		.badge.on { background: #ffd35c; color: #6b4a00; }
		.detail { width: 360px; padding: 18px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; align-self: flex-start; max-height: 100%; }
		.detail-thumb { flex: none; aspect-ratio: 16 / 11; border-radius: 14px; background: var(--grass); display: grid; place-items: center; overflow: hidden; }
		.detail-thumb .thumb { width: 100%; height: 100%; }
		.detail-thumb[data-season="summer"] { background: #cfe3b8; }
		.detail-thumb[data-season="spring"] { background: #c9ecc4; }
		.detail-thumb[data-season="autumn"] { background: #f1d9a8; }
		.detail-thumb[data-season="winter"] { background: #e6eef9; }
		.detail h3 { margin: 4px 0 0; font-size: 26px; font-weight: 900; font-style: italic; letter-spacing: var(--track); overflow-wrap: anywhere; }
		.detail .by { margin: 0; color: var(--muted); font-size: 13.5px; }
		.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
		.stats div { padding: 10px 12px; border-radius: 12px; background: var(--soft); }
		.stats small { display: block; font-size: 11px; font-weight: 900; letter-spacing: var(--track); text-transform: uppercase; color: var(--muted); }
		.stats b { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
		.board { margin: 0; padding: 0; list-style: none; font-size: 13.5px; font-variant-numeric: tabular-nums; }
		.board li { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; padding: 6px 8px; border-radius: 8px; }
		.board li:nth-child(odd):not(.muted) { background: var(--soft); }
		.board li span:first-child { color: var(--muted); font-weight: 900; }
		.board li.me { background: #fff1e8; color: var(--accent-hover); font-weight: 900; }
		.board li.muted { display: block; color: var(--muted); padding: 4px 2px; }
		.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
		.row.actions { margin-top: 6px; }
		.seed { display: flex; gap: 6px; }
		.seed input { font-variant-numeric: tabular-nums; font-size: 17px; }
		.seed button { padding: 0 14px; border-radius: 12px; background: var(--soft); font-weight: 900; white-space: nowrap; }
		.seed button:hover { background: var(--soft-hover); }

		/* ─── Settings ─── */
		/* Paramètres: tabs Graphismes / Son / Contrôles. No card: bento tiles in a column on the left like the
		   Circuit / Spéciale walls (white, dark = chosen, orange = active, white captions over the screen's shaded side),
		   the column turned a little into the depth like the back button */
		body:is([data-screen=settings], [data-screen=legal])::before { content: ''; position: fixed; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(90deg, rgba(12, 16, 24, 0.62) 0%, rgba(12, 16, 24, 0.4) 30%, rgba(12, 16, 24, 0) 52%); }
		.settings-panel { position: fixed; top: 96px; left: 32px; width: 440px; max-height: calc(100vh - 128px); overflow-y: auto; padding: 4px 14px 18px 4px; background: none; box-shadow: none; border-radius: 0; backdrop-filter: none; -webkit-backdrop-filter: none; transform: perspective(1400px) rotateY(8deg); transform-origin: left center; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.5) transparent; }
		.settings-panel .tabs { gap: 8px; padding: 0; background: none; border-radius: 0; }
		.settings-panel .tabs button, .settings-panel .preset, .settings-panel .switch, .settings-panel .slider, .settings-panel .binds, .settings-panel .chip { position: relative; overflow: hidden; isolation: isolate; border-radius: 9px; background: var(--card); box-shadow: 0 6px 14px rgba(8, 10, 16, 0.22); }
		.settings-panel .tabs button { padding: 13px 10px; font-size: 16px; transition: color 0.25s; }
		/* Hovered, orange rises from the tile's foot (the walls' tabs, the back button) */
		.settings-panel .tabs button::before, .settings-panel .chip::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--accent); transform: scaleY(0); transform-origin: bottom; transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
		.settings-panel .tabs button:hover, .settings-panel .chip:hover { background: var(--card); color: #fff; }
		.settings-panel .tabs button:hover::before, .settings-panel .chip:hover::before { transform: scaleY(1); }
		.settings-panel .tabs button.on { background: var(--ink); color: #fff; box-shadow: 0 6px 14px rgba(8, 10, 16, 0.22); }
		.settings-panel .tabs button.on::before { display: none; }
		.settings-panel .field { margin: 18px 2px 8px; color: #fff; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-shadow: 0 1px 4px rgba(8, 10, 16, 0.55); }
		.settings-panel .note { color: rgba(255, 255, 255, 0.86); font-weight: 700; text-shadow: 0 1px 4px rgba(8, 10, 16, 0.6); }
		.tab-body { margin-top: 14px; }
		.tab-body.fresh { animation: tab-in 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }
		@keyframes tab-in { from { opacity: 0; transform: translateY(10px); } }
		.settings-panel .row { margin-top: 10px; }
		.presets { display: flex; flex-direction: column; gap: 8px; }
		.preset { display: block; width: 100%; text-align: left; padding: 14px 16px; transition: box-shadow 0.2s; }
