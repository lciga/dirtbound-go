	<script>
		// Dev only (?capture, the trailer's gameplay; lab/Capture.js): the game's
		// clock and frames handed over to the capture, the window 1920 × 1080 at ratio 1
		if ( /[?&]capture\b/.test( location.search ) ) {

			const q = new URLSearchParams( location.search ), size = ( q.get( 'size' ) || '1920x1080' ).split( 'x' ).map( Number );
			const realNow = performance.now.bind( performance ), realRAF = window.requestAnimationFrame.bind( window );
			let now = realNow(), callbacks = [];
			const capture = window.__capture = { manual: false, fps: Number( q.get( 'fps' ) ) || 60, realNow, realRAF };
			performance.now = () => now;
			window.requestAnimationFrame = ( cb ) => callbacks.push( cb );
			// One frame of the game, exactly 1 / fps later
			capture.step = () => {

				const due = callbacks;
				callbacks = [];
				now += 1000 / capture.fps;
				for ( const cb of due ) cb( now );

			};
			// Until the capture takes over: frames in real time (loading); then an empty loop
			// keeps the page drawing (a canvas toBlob waits for a drawn frame)
			const pump = () => {

				if ( ! capture.manual ) {

					const due = callbacks;
					callbacks = [];
					now = realNow();
					for ( const cb of due ) cb( now );

				}

				realRAF( pump );

			};
			realRAF( pump );
			Object.defineProperty( window, 'innerWidth', { get: () => size[ 0 ] } );
			Object.defineProperty( window, 'innerHeight', { get: () => size[ 1 ] } );
			Object.defineProperty( window, 'devicePixelRatio', { get: () => 1 } );

		}
	</script>

	<style>
		/* Page transition (js/PageTransition.js): white frame, 16:9 window, the loading bar */
		#page-loader { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; pointer-events: none; }
		#page-loader div { --w: min(56vw, 99.5vh); position: relative; width: var(--w); height: calc(var(--w) * 9 / 16); background: #f2f2f2; box-shadow: 0 0 0 100vmax #fff; transition: width 0.9s cubic-bezier(0.92, 0, 0.48, 1), height 0.9s cubic-bezier(0.92, 0, 0.48, 1); }
		#page-loader i { position: absolute; inset: 0; background: #000; transform: scaleX(0); transform-origin: left; will-change: transform; transition: opacity 0.45s ease; }
		#page-loader[data-state=fade] div, #page-loader[data-state=open] div { background: transparent; }
		#page-loader[data-state=fade] i, #page-loader[data-state=open] i { opacity: 0; }
		#page-loader[data-state=open] div { width: 100vw; height: 100vh; }
		/* The HUD waits for the window to be open (PageLoading slides it in) */
		html[data-ui=wait] body > :not(canvas, #page-loader) { visibility: hidden; }
