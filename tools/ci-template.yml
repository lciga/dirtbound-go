name: Go and browser physics
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: integration
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d integration"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-test-password@localhost:5432/integration?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: go test -race ./...
      - run: ./tools/build.sh
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:parity
      - run: npm run test:assets
      - run: npm run test:race-start
      - run: npm run test:customization
      - run: npm run test:catalog
